name: Monthly GB Electricity Parquet Update

on:
  schedule:
    # Automatic monthly refresh: 06:17 UTC on the 2nd day of each month.
    # The script inspects the latest three closed months and fills gaps only.
    - cron: '17 6 2 * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional inspection/repair start date YYYY-MM-DD.
        required: false
        default: ''
      end_date:
        description: Optional inspection/repair end date YYYY-MM-DD.
        required: false
        default: ''
      refetch_months:
        description: Recent complete months to inspect for missing partitions. Existing months stay frozen.
        required: false
        default: '3'
      datasets:
        description: Space-separated list from fuelinst fuelhh prices.
        required: false
        default: 'fuelinst fuelhh prices'
      repair_existing:
        description: Replace existing history. Requires explicit start and end dates and remains bounded.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: monthly-gb-electricity-parquet-update
  cancel-in-progress: false

jobs:
  monthly-update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      START_DATE: ${{ github.event.inputs.start_date || '' }}
      END_DATE: ${{ github.event.inputs.end_date || '' }}
      REFETCH_MONTHS: ${{ github.event.inputs.refetch_months || '3' }}
      DATASETS: ${{ github.event.inputs.datasets || 'fuelinst fuelhh prices' }}
      REPAIR_EXISTING: ${{ github.event.inputs.repair_existing || 'false' }}
      MAX_DATASET_MONTHS: '9'
      MAX_NEW_ROWS: '2000000'
      MAX_NEW_PARQUET_FILES: '9'
      MAX_NEW_PARQUET_BYTES: '134217728'
      MAX_API_REQUESTS: '200'
      MAX_API_ATTEMPTS: '600'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify environment and install dependencies
        run: |
          set -euo pipefail
          git --version
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install duckdb pyarrow
          python3 -c "import duckdb, pyarrow; print('ok')"

      - name: Prove bounded-growth policy
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Fetch latest month and write Parquet
        run: |
          set -euo pipefail
          if ! [[ "${REFETCH_MONTHS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "refetch_months must be a positive integer" >&2
            exit 2
          fi
          read -r -a REQUESTED_DATASETS <<< "${DATASETS}"
          for dataset in "${REQUESTED_DATASETS[@]}"; do
            case "${dataset}" in
              fuelinst|fuelhh|prices) ;;
              *) echo "invalid dataset: ${dataset}" >&2; exit 2 ;;
            esac
          done
          ARGS=(
            --apply
            --datasets "${REQUESTED_DATASETS[@]}"
            --refetch-months "${REFETCH_MONTHS}"
            --max-dataset-months "${MAX_DATASET_MONTHS}"
            --max-new-rows "${MAX_NEW_ROWS}"
            --max-new-parquet-bytes "${MAX_NEW_PARQUET_BYTES}"
            --max-api-requests "${MAX_API_REQUESTS}"
            --max-api-attempts "${MAX_API_ATTEMPTS}"
          )
          if [ -n "${START_DATE}" ]; then ARGS+=(--start-date "${START_DATE}"); fi
          if [ -n "${END_DATE}" ]; then ARGS+=(--end-date "${END_DATE}"); fi
          if [ "${REPAIR_EXISTING}" = "true" ]; then ARGS+=(--repair-existing); fi
          printf 'fetch argument: %q\n' "${ARGS[@]}"
          python3 pipelines/fetch_latest_month.py "${ARGS[@]}"

      - name: Verify actual repository growth against the plan
        run: |
          set -euo pipefail
          python3 pipelines/verify_bounded_growth.py \
            --audit reports/fetch_latest_month_latest.json \
            --base HEAD \
            --max-new-parquet-files "${MAX_NEW_PARQUET_FILES}" \
            --max-new-parquet-bytes "${MAX_NEW_PARQUET_BYTES}"

      - name: Print audit summary
        if: always()
        run: |
          if [ -f reports/latest_parquet_audit.json ]; then
            cat reports/latest_parquet_audit.json
          else
            echo "reports/latest_parquet_audit.json not found"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-parquet-audit
          path: |
            reports/latest_parquet_audit.json
            reports/fetch_latest_month_latest.json
            reports/bounded_growth_gate_latest.json

      - name: Commit Parquet outputs
        run: |
          set -euo pipefail
          CHANGED_PARQUET=$(python3 -c "import json; print(json.load(open('reports/bounded_growth_gate_latest.json'))['limits']['actualChangedParquetFiles'])")
          if [ "${CHANGED_PARQUET}" = "0" ]; then
            echo "The bounded plan produced no Parquet diff; audit artifact was uploaded, no repository commit needed."
            exit 0
          fi
          TARGET_MONTH=$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('reports/latest_parquet_audit.json')
          if p.exists():
              payload = json.loads(p.read_text())
              print('_'.join(payload.get('targetMonths', ['unknown'])))
          else:
              print('unknown')
          PY
          )
          git config user.name "gridbot"
          git config user.email "bot@globalgrid2050.com"
          if [ -d generation ]; then
            git add generation/
          fi
          if [ -d prices ]; then
            git add prices/
          fi
          if [ -d reports ]; then
            git add reports/
          fi
          if git diff --cached --quiet; then
            echo "No Parquet or audit changes to commit."
            exit 0
          fi
          git commit -m "data(gb-electricity): auto monthly fetch ${TARGET_MONTH}"
          if git push origin HEAD:"${GITHUB_REF_NAME}"; then
            echo "Pushed monthly outputs."
          else
            echo "Initial push rejected; rebasing once and retrying."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
